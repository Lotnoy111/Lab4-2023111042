name: tests  # 工作流名称，可自定义
on: push  # 触发条件：代码 push 到仓库时执行
jobs:
  run_tests:
    runs-on: ubuntu-latest  # 运行环境：最新版 Ubuntu
    steps:
      # 步骤1：拉取仓库代码
      - name: Checkout the repository
        uses: actions/checkout@v4
      # 步骤2：配置 OpenJDK 21（核心修改处）
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'  # 改为你的 Java 版本（与本地一致）
          distribution: 'temurin'  # 保持 Temurin 发行版（与本地 Temurin 匹配，兼容性最佳）

      # 步骤3：缓存 Maven 依赖（加速构建，避免重复下载）
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      # 步骤4：执行 Maven 单元测试（无需修改）
      - name: Run tests with Maven
        run: mvn -B test --file pom.xml
